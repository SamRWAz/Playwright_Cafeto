name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    name: ${{ matrix.test.name }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - id: 'test-1'
            name: 'Prueba 1 · Registro con correo sin @'
            file: 'tests/test-1.spec.ts'
          - id: 'test-2'
            name: 'Prueba 2 · Contraseñas desiguales'
            file: 'tests/test-2.spec.ts'
          - id: 'test-3'
            name: 'Prueba 3 · Fortaleza de contraseña'
            file: 'tests/test-3.spec.ts'
          - id: 'test-4'
            name: 'Prueba 4 · Registro exitoso'
            file: 'tests/test-4.spec.ts'
          - id: 'suite-pom'
            name: 'Suite POM · PaginaRegistro'
            file: 'tests/registro.spec.ts'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Instalar dependencias de Cafeteria
      run: |
        cd cafeteria
        npm install
    - name: Iniciar Cafeteria en segundo plano
      run: |
        cd cafeteria
        npm start &
    - name: Instalar dependencias de Pipeline (Playwright)
      run: |
        cd pipeline
        npm install
        npx playwright install --with-deps chromium
    - name: Ejecutar prueba individual
      run: |
        cd pipeline
        npx playwright test ${{ matrix.test.file }} --project=chromium
    - name: Subir reporte de esta prueba
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: reporte-${{ matrix.test.id }}
        path: pipeline/playwright-report/
        retention-days: 14
